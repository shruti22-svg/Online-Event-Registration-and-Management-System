services:
  app:
    build: .
    environment:
      PORT: 5000
      EVENT_DB: /tmp/events.db
      SECRET_KEY: ci-secret
    expose:
      - "5000"

  chrome:
    image: selenium/standalone-chrome:4.27.0
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "127.0.0.1", "--port", "4444"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    depends_on:
      - app

  tests:
    build:
      context: .
      dockerfile: tests/selenium/Dockerfile
    environment:
      BASE_URL: http://app:5000
      SELENIUM_REMOTE_URL: http://chrome:4444/wd/hub
    depends_on:
      app:
        condition: service_started
      chrome:
        condition: service_healthy
